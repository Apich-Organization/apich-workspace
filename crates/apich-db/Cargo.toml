[package]
name = "apich-db"
version = "0.1.0"
edition = "2021"
authors = ["APICH Team"]
description = "PostgreSQL container lifecycle, persistence, backups, permissions, and core data models for APICH Technical & Academic Workspace"
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
apich-sandbox = { path = "../apich-sandbox" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
