[package]
name = "apich-sandbox"
version = "0.1.0"
edition = "2021"
authors = ["APICH Team"]
description = "Containerized sandbox and runtime management powered by Podman for APICH technical and academic workspace"
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-stream = { version = "0.1" }
futures = { version = "0.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
