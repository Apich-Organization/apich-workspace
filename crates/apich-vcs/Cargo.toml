[package]
name = "apich-vcs"
version = "0.1.0"
edition = "2021"
authors = ["APICH Team"]
description = "Weave-free, continuous auto-saving, FastCDC-chunked version control system with bidirectional Git bridge for APICH Technical & Academic Workspace"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
sha2 = "0.10"
git2 = { version = "0.19", default-features = false }
globset = "0.4"
flate2 = "1.0"
tar = "0.4.46"
toml = "1.1.5"
rustix = { version = "1.1.4", features = ["fs"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
apich-sandbox = { path = "../apich-sandbox" }

