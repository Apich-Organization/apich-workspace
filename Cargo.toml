[workspace]
resolver = "2"
members = [
    "crates/apich-sandbox",
    "crates/apich-db",
    "crates/apich-vcs",
    "crates/apich-web",
    "crates/apich-islands",
]

# ==============================================================================
# LEVEL 1: CRITICAL ERRORS (Deny)
# ==============================================================================
[workspace.lints.rust]
unreachable_code = "deny"
improper_ctypes_definitions = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "deny"
# ------------------------------------------------------------------------
# LEVEL 2: STYLE WARNINGS (Warn)
# ------------------------------------------------------------------------
dead_code = "warn"
warnings = { level = "warn", priority = -1 }
unsafe_code = "warn"
# ------------------------------------------------------------------------
# LEVEL 3: ALLOW/IGNORABLE (Allow)
# ------------------------------------------------------------------------
unused_doc_comments = "allow"

[workspace.lints.clippy]
perf = "deny"
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
missing_safety_doc = "deny"
same_item_push = "deny"
implicit_clone = "deny"
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# ------------------------------------------------------------------------
# LEVEL 2: STYLE WARNINGS (Warn)
# ------------------------------------------------------------------------
dbg_macro = { level = "warn", priority = 1 }
todo = { level = "warn", priority = 1 }
unnecessary_safety_comment = { level = "warn", priority = 1 }
# ------------------------------------------------------------------------
# LEVEL 3: ALLOW/IGNORABLE (Allow)
# ------------------------------------------------------------------------
restriction = { level = "allow", priority = -1 }
inline_always = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
empty_line_after_doc_comments = { level = "allow", priority = 1 }
single_call_fn = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
