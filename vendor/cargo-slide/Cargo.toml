[workspace]
resolver = "2"
members = [
    "crates/slide-core",
    "crates/slide-player",
    "crates/slide-theme",
    "crates/cargo-slide",
    "crates/slide-viewer",
    "crates/slide-web",
    "examples/geek-presentation",
]
default-members = ["crates/cargo-slide"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = [
    "Xinyu Yang <Xinyu.Yang@apich.org>",
    "Apich Organization <info@apich.org>",
    "Cargo Slide Contributors",
]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Apich-Organization/cargo-slide"
homepage = "https://github.com/Apich-Organization/cargo-slide"
documentation = "https://docs.rs/cargo-slide"
readme = "README.md"
description = "Code-driven presentation engine combining Typst typesetting with a native Rust viewer, developed as part of the Apich workspace backend."
categories = [
    "command-line-utilities",
    "development-tools::cargo-plugins",
    "visualization",
    "rendering::engine",
    "multimedia",
]
keywords = ["typst", "presentation", "slides", "cargo-subcommand", "cli"]
exclude = [
    "/.github",
    "/.build_tmp",
    "/examples",
    "/assets",
    "*.mp4",
    "*.wav",
]

[workspace.dependencies]
slide-core = { path = "crates/slide-core", version = "0.2.0" }
slide-player = { path = "crates/slide-player", version = "0.2.0" }
slide-theme = { path = "crates/slide-theme", version = "0.2.0" }
slide-viewer = { path = "crates/slide-viewer", version = "0.2.0" }

resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
tiny-skia-path = "0.12"
roxmltree = "0.21"
svgtypes = "0.16"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "cargo"] }
thiserror = "2.0"
open = "5.4"
minifb = "0.28"
notify = "8.2"
tempfile = "3.27"
walkdir = "2.5"
rodio = "0.22"
csv = "1.4"
rusqlite = { version = "0.40", features = ["bundled"] }
zip = "8.6"
tar = "0.4"
xz2 = "0.1"
lzma-rs = "0.3"
tiny_http = "0.12"
leptos = { version = "0.8", default-features = false, features = ["csr"] }
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1"
web-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = true

[workspace.lints.rust]
# ==============================================================================
# LEVEL 1: CRITICAL ERRORS (Forbid)
# ==============================================================================
unreachable_code = "forbid"
improper_ctypes_definitions = "forbid"
future_incompatible = { level = "forbid", priority = -1 }
nonstandard_style = { level = "forbid", priority = -1 }
rust_2018_idioms = { level = "forbid", priority = -1 }
missing_docs = "forbid"
# ------------------------------------------------------------------------
# LEVEL 2: STYLE WARNINGS (Warn)
# ------------------------------------------------------------------------
dead_code = "warn"
warnings = { level = "warn", priority = -1 }
unsafe_code = "warn"
# ------------------------------------------------------------------------
# LEVEL 3: ALLOW/IGNORABLE (Allow)
# ------------------------------------------------------------------------
unused_doc_comments = "allow"

[workspace.lints.clippy]
# ==============================================================================
# LEVEL 1: CRITICAL ERRORS (Forbid)
# ==============================================================================
perf = "forbid"
correctness = "forbid"
suspicious = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
missing_safety_doc = "forbid"
same_item_push = "forbid"
implicit_clone = "forbid"
all = { level = "forbid", priority = -1 }
pedantic = { level = "forbid", priority = -1 }
nursery = { level = "forbid", priority = -1 }
single_call_fn = "forbid"
# ------------------------------------------------------------------------
# LEVEL 2: STYLE WARNINGS (Warn)
# ------------------------------------------------------------------------
dbg_macro = { level = "warn", priority = 1 }
todo = { level = "warn", priority = 1 }
unnecessary_safety_comment = { level = "warn", priority = 1 }
# ------------------------------------------------------------------------
# LEVEL 3: ALLOW/IGNORABLE (Allow)
# ------------------------------------------------------------------------
restriction = { level = "allow", priority = -1 }
inline_always = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
empty_line_after_doc_comments = { level = "allow", priority = 1 }
