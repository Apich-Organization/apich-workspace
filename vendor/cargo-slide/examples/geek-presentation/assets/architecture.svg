<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#bd561d"/>
    </linearGradient>
  </defs>

  <!-- Node 1: Typst Source -->
  <rect x="20" y="40" width="160" height="150" rx="10" fill="url(#bgGrad)" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="100" cy="80" r="22" fill="url(#blueGrad)"/>
  <text x="100" y="86" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">typ</text>
  <text x="100" y="128" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="middle">Typst Markup</text>
  <text x="100" y="150" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Math, Layout, Style</text>
  <text x="100" y="168" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Fast incremental</text>

  <!-- Arrow 1 -->
  <path d="M 190 115 L 240 115" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="240,115 230,110 230,120" fill="#58a6ff"/>

  <!-- Node 2: Compiler -->
  <rect x="250" y="40" width="160" height="150" rx="10" fill="url(#bgGrad)" stroke="#f0883e" stroke-width="1.5"/>
  <circle cx="330" cy="80" r="22" fill="url(#orangeGrad)"/>
  <text x="330" y="86" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">⚙</text>
  <text x="330" y="128" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="middle">SlideCompiler</text>
  <text x="330" y="150" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">SVG + Hotspot AST</text>
  <text x="330" y="168" font-family="sans-serif" font-size="10" fill="#f0883e" text-anchor="middle">Single Binary Embed</text>

  <!-- Arrow 2 -->
  <path d="M 420 115 L 470 115" stroke="#f0883e" stroke-width="2"/>
  <polygon points="470,115 460,110 460,120" fill="#f0883e"/>

  <!-- Node 3: Rust Engine -->
  <rect x="480" y="40" width="290" height="150" rx="10" fill="url(#bgGrad)" stroke="#39d353" stroke-width="1.5"/>
  <circle cx="625" cy="75" r="20" fill="url(#cyanGrad)"/>
  <text x="625" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡</text>
  <text x="625" y="115" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">Rust Native Runtime</text>
  <text x="625" y="135" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Minifb 60 FPS • SvgRenderer (resvg)</text>
  <text x="625" y="153" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">rodio Audio • Laser • Pen • Dock</text>
  <text x="625" y="173" font-family="sans-serif" font-size="11" font-weight="bold" fill="#39d353" text-anchor="middle">Linux • macOS • Windows</text>
</svg>